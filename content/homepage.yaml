heroHeading: Higher Wage Wisconsin
heroParagraph: >-
  Minimum wage in Wisconsin is $7.25 per hour and has not changed in 17 years!
  The goal of this site is to highlight those businesses that are not waiting
  for the minimum wage to increase. We believe that human labor is needed for
  our communities and our businesses, and that that time should be compensated
  to meet the needs of the community.
optInStatement: We opt in to a higher minimum wage.
lookingHeading: Looking for more businesses!
lookingBody: >-
  Know anyone that has a starting hourly pay for their employees over $15 per
  hour (Pre-tips)? Send them my way!
goalsHeading: 'Goals of the group:'
goals:
  - text: >-
      Communicate to the public which businesses in the area are already paying
      a higher wage so they can know where their money is going.
  - text: >-
      Communicate to workers in the area that being paid a livable wage is not
      impossible from small or medium sized businesses.
  - text: >-
      Communicate to legislators that if they fought for workers' pay to be
      increased, there would be business owners that support that decision.
  - text: >-
      Convince other businesses that it is in their best interest for the good
      of their staff, community, and bottom line to pay more of a wage to their
      staff.
howItWorksHeading: 'How this works:'
howItWorksParagraphs:
  - text: >-
      I don't know, right now I have so many ideas, but it starts with the
      businesses and the community, please let me know your ideas and thoughts!
  - text: >-
      If you are a business that starts its employees at $15, $20, or $25 per
      hour (before tips) then you get a vinyl door sticker or sign that
      advertises that to the public. I will be making these on my vinyl cutter
      and am getting the design made right now. (This will not cost you
      anything) I should note that the design for this is being made right now
      by a human who is being paid a fair wage for their labor. No AI included.
  - text: >-
      We can work together to help market each other and build community in
      small businesses that put people over profit.
  - text: >-
      Special thanks to Collin Pendleton for his site building skills!  Find
      more info at https://gooseberrydevelopment.com/
wantToJoinHeading: Want to Join!?
wantToJoinBody: >-
  Are you a part of a business with a higher minimum wage and want to join the
  club? Know a business who is paying over $15 for their starting wage? Let me
  know! Let's lift up the ones doing the work!
